[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-query-method"
version = "0.1.0"
description = "HTTP QUERY method (RFC 10008) support for Django REST framework."
readme = "README.md"
authors = [
  {name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk"}
]
maintainers = [
  {name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "django>=4.2",
  "djangorestframework>=3.16",
]
requires-python = ">= 3.10"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "django-filter",
    "pytest",
    "pytest-django",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.optional-dependencies]
django-filter = ["django-filter"]

[project.urls]
bugs = "https://github.com/BenA-SA/drf-query-method/issues"
changelog = "https://github.com/BenA-SA/drf-query-method/releases"
documentation = "https://BenA-SA.github.io/drf-query-method/"
homepage = "https://github.com/BenA-SA/drf-query-method"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[[tool.ty.overrides]]
# These tests use attributes that patch() adds to DRF at runtime.
include = ["tests/test_patching.py"]
rules = { unresolved-attribute = "ignore" }

[tool.ruff]
line-length = 120
# The release script declares its own Python requirement (3.11+, for tomllib).
per-file-target-version = { "scripts/*.py" = "py311" }

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/drf_query_method"]

[tool.uv]
package = true
default-groups = ["dev"]
exclude-newer = "1 week"
