name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Type check with ty
        run: uv run ty check .

  test:
    name: Test (Python ${{ matrix.python }}, Django ${{ matrix.django }}, DRF ${{ matrix.drf }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "4.2", drf: "3.16" }
          - { python: "3.11", django: "5.0", drf: "3.16" }
          - { python: "3.12", django: "5.1", drf: "3.16" }
          - { python: "3.12", django: "4.2", drf: "3.17" }
          - { python: "3.13", django: "5.2", drf: "3.17" }
          - { python: "3.13", django: "6.0", drf: "3.17" }
          - { python: "3.12", django: "5.2", drf: "3.18" }
          - { python: "3.14", django: "6.0", drf: "3.18" }
          - { python: "3.14", django: "6.1", drf: "3.18" }
          - { python: "3.14", django: "main", drf: "main", experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Django ${{ matrix.django }} and DRF ${{ matrix.drf }}
        env:
          PYTHON: ${{ matrix.python }}
          DJANGO: ${{ matrix.django }}
          DRF: ${{ matrix.drf }}
        run: |
          if [ "$DJANGO" = "main" ]; then
            django_req="django @ https://github.com/django/django/archive/main.tar.gz"
          else
            django_req="django~=$DJANGO.0"
          fi
          if [ "$DRF" = "main" ]; then
            drf_req="djangorestframework @ https://github.com/encode/django-rest-framework/archive/main.tar.gz"
          else
            drf_req="djangorestframework~=$DRF.0"
          fi
          uv venv --python "$PYTHON"
          uv pip install -e . "$django_req" "$drf_req" coverage pytest pytest-django

      - name: Run tests with coverage
        run: .venv/bin/coverage run -m pytest

      - name: Upload coverage data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.django }}-${{ matrix.drf }}
          path: .coverage.*
          include-hidden-files: true

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage
        run: uv run coverage combine

      - name: Coverage report
        run: |
          echo '## Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run coverage report | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  all-checks-pass:
    name: All checks pass
    if: always()
    needs: [lint, type-check, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
